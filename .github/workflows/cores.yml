# Mirrors the tunnel cores from their official projects into this repo's
# release "cores", with fixed file names that the NETIFAY panel downloads.
# Run it from the Actions tab (Run workflow); it also runs every Monday.
name: Update cores

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  cores:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download official releases
        shell: bash
        run: |
          set -u
          mkdir -p out && cd out
          ok=(); fail=()
          get() {  # get <repo> <tag|latest> <pattern> <output>
            local repo="$1" tag="$2" pat="$3" outf="$4" args=()
            [ "$tag" != "latest" ] && args=("$tag")
            if gh release download "${args[@]}" -R "$repo" -p "$pat" -O "$outf" --clobber; then
              ok+=("$outf <- $repo $tag")
            else
              fail+=("$outf <- $repo $tag ($pat)")
            fi
          }
          # rathole (amd64 gnu needs libssl3; musl v0.4.8 is used on Ubuntu 20.04 / Debian 11)
          get rapiz1/rathole latest 'rathole-x86_64-unknown-linux-gnu.zip'   rathole-linux-amd64.zip
          get rapiz1/rathole v0.4.8 'rathole-x86_64-unknown-linux-musl.zip'  rathole-musl-linux-amd64.zip
          get rapiz1/rathole latest 'rathole-aarch64-unknown-linux-musl.zip' rathole-linux-arm64.zip
          # backhaul
          get Musixal/Backhaul latest 'backhaul_linux_amd64.tar.gz' backhaul-linux-amd64.tar.gz
          get Musixal/Backhaul latest 'backhaul_linux_arm64.tar.gz' backhaul-linux-arm64.tar.gz
          # frp
          get fatedier/frp latest 'frp_*_linux_amd64.tar.gz' frp-linux-amd64.tar.gz
          get fatedier/frp latest 'frp_*_linux_arm64.tar.gz' frp-linux-arm64.tar.gz
          # gost v3
          get go-gost/gost latest 'gost_*_linux_amd64.tar.gz' gost-linux-amd64.tar.gz
          get go-gost/gost latest 'gost_*_linux_arm64.tar.gz' gost-linux-arm64.tar.gz
          # hysteria 2
          get apernet/hysteria latest 'hysteria-linux-amd64' hysteria-linux-amd64
          get apernet/hysteria latest 'hysteria-linux-arm64' hysteria-linux-arm64
          # xray
          get XTLS/Xray-core latest 'Xray-linux-64.zip'        xray-linux-amd64.zip
          get XTLS/Xray-core latest 'Xray-linux-arm64-v8a.zip' xray-linux-arm64.zip
          # phantun (Fake TCP) - official static builds
          get dndx/phantun latest 'phantun_x86_64-unknown-linux-musl.zip'  phantun-linux-amd64.zip
          get dndx/phantun latest 'phantun_aarch64-unknown-linux-musl.zip' phantun-linux-arm64.zip
          printf '%s\n' "${ok[@]}" > ../ok.txt; printf '%s\n' "${fail[@]}" > ../fail.txt

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build cores that have no ready Linux release (static)
        shell: bash
        run: |
          set -u
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu >/dev/null
          mkdir -p src && cd src
          ok=(); fail=()
          build() {  # build <label> <commands...>
            local label="$1"; shift
            if ( set -e; "$@" ); then ok+=("$label (built from source)"); else fail+=("$label (build failed)"); fi
          }
          git clone -q --depth 1 https://github.com/amnezia-vpn/amneziawg-go
          git clone -q --depth 1 https://github.com/amnezia-vpn/amneziawg-tools
          git clone -q --depth 1 https://github.com/esrrhs/pingtunnel
          git clone -q --depth 1 https://github.com/wangyu-/UDPspeeder
          git clone -q --depth 1 https://www.bamsoftware.com/git/dnstt.git || git clone -q --depth 1 https://github.com/Mygod/dnstt dnstt
          SP="main.cpp log.cpp common.cpp lib/fec.cpp lib/rs.cpp crc32/Crc32.cpp packet.cpp delay_manager.cpp fd_manager.cpp connection.cpp fec_manager.cpp misc.cpp tunnel_client.cpp tunnel_server.cpp my_ev.cpp"
          for arch in amd64 arm64; do
            cc=gcc; cxx=g++; [ $arch = arm64 ] && { cc=aarch64-linux-gnu-gcc; cxx=aarch64-linux-gnu-g++; }
            d=$PWD/bin-$arch; mkdir -p $d
            build "amneziawg $arch" bash -c "cd amneziawg-go && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags '-s -w' -o $d/amneziawg-go . && cd ../amneziawg-tools/src && make clean >/dev/null && make CC=$cc LDFLAGS=-static >/dev/null && cp wg $d/awg && cd $d && tar czf ../../out/amneziawg-linux-$arch.tar.gz amneziawg-go awg"
            build "pingtunnel $arch" bash -c "cd pingtunnel && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags '-s -w' -o $d/pingtunnel ./cmd && cd $d && tar czf ../../out/pingtunnel-linux-$arch.tar.gz pingtunnel"
            build "dnstt $arch" bash -c "cd dnstt && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags '-s -w' -o $d/dnstt-server ./dnstt-server && CGO_ENABLED=0 GOARCH=$arch go build -trimpath -ldflags '-s -w' -o $d/dnstt-client ./dnstt-client && cd $d && tar czf ../../out/dnstt-linux-$arch.tar.gz dnstt-server dnstt-client"
            build "udpspeeder $arch" bash -c "cd UDPspeeder && echo 'const char *gitversion = \"$(git -C UDPspeeder rev-parse --short HEAD)\";' > git_version.h && $cxx -o $d/speederv2 -I. $SP -isystem libev -std=c++11 -O2 -static -lrt && cd $d && tar czf ../../out/udpspeeder-linux-$arch.tar.gz speederv2"
          done
          cd ..
          printf '%s\n' "${ok[@]}" >> ok.txt; printf '%s\n' "${fail[@]}" >> fail.txt

      - name: Versions and checksums
        shell: bash
        run: |
          cd out
          {
            echo "Updated: $(date -u +%Y-%m-%dT%H:%MZ)"; echo
            grep -v '^$' ../ok.txt
            if grep -q . ../fail.txt; then echo; echo "NOT UPDATED (upload manually if needed):"; grep -v '^$' ../fail.txt; fi
          } > VERSIONS.txt
          cat VERSIONS.txt
          sha256sum * > SHA256SUMS.txt

      - name: Publish to release "cores"
        shell: bash
        run: |
          gh release view cores -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create cores -R "$GITHUB_REPOSITORY" --title "Cores" \
              --notes "Tunnel cores used by the NETIFAY panel. Updated by the 'Update cores' workflow."
          gh release upload cores -R "$GITHUB_REPOSITORY" out/* --clobber
          # keep the tag on the latest commit of the default branch
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/cores" -f sha="$GITHUB_SHA" -F force=true >/dev/null
